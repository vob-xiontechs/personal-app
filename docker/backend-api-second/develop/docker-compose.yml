version: '3.8'

services:
  backend-api-second:
    build:
      context: ../../../backend-api-second
      dockerfile: Dockerfile
    container_name: backend-api-second-develop
    restart: unless-stopped
    ports:
      - "8010:8010"

    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../../../backend-api-second:/var/www/html:cached
      - ./logs:/var/www/html/storage/logs
    networks:
      - backend-api-second-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7.0
    container_name: mongodb-develop
    restart: unless-stopped
    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./backup:/backup
    networks:
      - backend-api-second-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    driver: local

networks:
  backend-api-second-network:
    driver: bridge
    name: backend-api-second-develop
