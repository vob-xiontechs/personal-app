spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: jdbc:mysql://db:3306/develop_db?useSSL=false&serverTimezone=UTC
    username: develop_user
    password: develop_pass
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081
